[platformio]
default_envs = nexus-esp32

[env:nexus-esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit INA219 @ ^1.2.3
build_flags =
  -D NEXUS_DEVICE_ID=\"nexus-demo-esp32\"
  -D NEXUS_HARDWARE_MODEL_ID=\"nexus-motor-rig-v1\"
  -D NEXUS_MAX_PWM_PERCENT=80

[platformio]
default_envs = nexus-esp32-s3-devkitc-3wheel-ps2

[env:nexus-esp32-s3-devkitc-3wheel-ps2]
platform = espressif32
board = nexus-esp32-s3-devkitc-n16r8
framework = arduino
extra_scripts = pre:scripts/nexus_profile_codegen.py
custom_nexus_hardware_profile = ../nexus-hardware/profiles/nexus-profile-esp32-s3-devkitc-ina219-dual-l298n-3wheel-ps2-v2.json
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_protocol = esptool
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter =
  -<main.cpp>
  +<main_three_wheel_ps2.cpp>

[env:nexus-esp32-s3-devkitc-3wheel-ps2-native-usb]
extends = env:nexus-esp32-s3-devkitc-3wheel-ps2
upload_protocol = esp-builtin
build_unflags =
  -std=gnu++11
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:nexus-goouuu-esp32-s3-n16r8]
platform = espressif32
board = nexus-goouuu-esp32-s3-n16r8
framework = arduino
extra_scripts = pre:scripts/nexus_profile_codegen.py
custom_nexus_hardware_profile = ../nexus-hardware/profiles/nexus-profile-goouuu-esp32-s3-ina226-l298n-jgb37-v1.json
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_protocol = esp-builtin
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  robtillaart/INA226 @ ^0.6.6
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
build_src_filter =
  +<main.cpp>
  -<main_three_wheel_ps2.cpp>

[env:nexus-goouuu-esp32-s3-ina226-r100-mvp-v1-uart]
extends = env:nexus-goouuu-esp32-s3-n16r8
upload_protocol = esptool
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  robtillaart/INA226 @ ^0.6.6
build_unflags =
  ${env:nexus-goouuu-esp32-s3-n16r8.build_unflags}
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  ${env:nexus-goouuu-esp32-s3-n16r8.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D NEXUS_ENABLE_COMMAND_WRITES=1

; Compatibility alias for older one-click launchers. It now builds the corrected
; physical R100 (0.100 ohm) profile above, never the former R010 calibration.
[env:nexus-goouuu-esp32-s3-ina226-r010-mvp-v1-uart]
extends = env:nexus-goouuu-esp32-s3-ina226-r100-mvp-v1-uart

[env:nexus-goouuu-esp32-s3-3wheel-ps2]
platform = espressif32
board = nexus-goouuu-esp32-s3-n16r8
framework = arduino
extra_scripts = pre:scripts/nexus_profile_codegen.py
custom_nexus_hardware_profile = ../nexus-hardware/profiles/nexus-profile-goouuu-esp32-s3-ina226-dual-l298n-3wheel-ps2-v1.json
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_protocol = esp-builtin
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  robtillaart/INA226 @ ^0.6.6
  adafruit/Adafruit BNO055 @ ^1.6.4
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
build_src_filter =
  -<main.cpp>
  +<main_three_wheel_ps2.cpp>

[env:nexus-goouuu-esp32-s3-3wheel-ps2-uart]
extends = env:nexus-goouuu-esp32-s3-3wheel-ps2
upload_protocol = esptool
build_unflags =
  ${env:nexus-goouuu-esp32-s3-3wheel-ps2.build_unflags}
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  ${env:nexus-goouuu-esp32-s3-3wheel-ps2.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0

[env:nexus-bno055-diagnostic]
extends = env:nexus-goouuu-esp32-s3-3wheel-ps2-uart
build_src_filter =
  -<main.cpp>
  -<main_three_wheel_ps2.cpp>
  +<diagnostic_bno055.cpp>

[env:nexus-ps2-diagnostic]
extends = env:nexus-goouuu-esp32-s3-3wheel-ps2-uart
build_flags =
  ${env:nexus-goouuu-esp32-s3-3wheel-ps2-uart.build_flags}
  -D NEXUS_PS2_DIAGNOSTIC=1

[env:nexus-goouuu-esp32-s3-n16r8-baseline]
extends = env:nexus-goouuu-esp32-s3-n16r8
build_flags =
  ${env:nexus-goouuu-esp32-s3-n16r8.build_flags}
  -D NEXUS_ENABLE_BASELINE_CONTROL=1

[env:nexus-goouuu-esp32-s3-n16r8-command-test]
extends = env:nexus-goouuu-esp32-s3-n16r8
build_flags =
  ${env:nexus-goouuu-esp32-s3-n16r8.build_flags}
  -D NEXUS_ENABLE_COMMAND_WRITES=1

[env:nexus-goouuu-esp32-s3-n16r8-fault-test]
extends = env:nexus-goouuu-esp32-s3-n16r8-command-test
build_flags =
  ${env:nexus-goouuu-esp32-s3-n16r8-command-test.build_flags}
  -D NEXUS_ENABLE_FAULT_INJECTION=1

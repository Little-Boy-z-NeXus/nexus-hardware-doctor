[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexus-backend"
version = "0.1.0"
description = "Policy-constrained hardware diagnosis backend for NeXus."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema[format]>=4.23,<5",
  "pydantic>=2.9,<3",
  "pyserial>=3.5,<4",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_backend"]

[tool.hatch.build.targets.wheel.force-include]
"../nexus-contracts/v1/schemas" = "nexus_backend/schemas"
"../nexus-contracts/v1/fixtures" = "nexus_backend/fixtures"
"../nexus-hardware/v1" = "nexus_backend/profile_data/schema"
"../nexus-hardware/profiles" = "nexus_backend/profile_data/profiles"

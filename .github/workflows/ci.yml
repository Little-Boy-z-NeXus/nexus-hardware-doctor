name: nexus-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate repository contract
        run: python scripts/validate_repo.py

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend
        run: pip install -c backend/constraints.txt -e "./backend[dev]"

      - name: Validate frozen interface contracts
        env:
          NEXUS_CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_contracts.py --base-ref "$NEXUS_CONTRACT_BASE_REF"

      - name: Lint backend and validators
        run: ruff check backend scripts

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Run explicitly simulated diagnosis regression
        run: python -m nexus_backend.evaluation --output /tmp/nexus-evaluation.json

  firmware:
    name: Firmware safe, baseline and command builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Compile all GOOUUU ESP32-S3 firmware safety modes
        run: >-
          pio run --project-dir firmware
          --environment nexus-goouuu-esp32-s3-n16r8
          --environment nexus-goouuu-esp32-s3-n16r8-baseline
          --environment nexus-goouuu-esp32-s3-n16r8-command-test

  packaging:
    name: Backend container and simulated regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build installed backend image
        run: docker build -t nexus-backend:ci .
      - name: Verify packaged prompts, cases and simulated flow
        run: docker run --rm nexus-backend:ci python -m nexus_backend.evaluation --output /tmp/nexus-evaluation.json
      - name: Verify packaged serial integration and challenge fixtures without hardware or API calls
        run: >-
          docker run --rm nexus-backend:ci python -c
          'from nexus_backend.serial_history import SerialHistory;
          from nexus_backend.serial_reads import SerialReadChannel;
          from nexus_backend.evaluation import load_cases, case_inputs;
          cases = load_cases("challenge");
          assert len(cases) == 12;
          [case_inputs(case) for case in cases];
          print("Installed serial integration and challenge fixtures: PASS")'
      - name: Verify installed application startup and both API families
        run: |
          docker run --detach --name nexus-backend-ci --publish 127.0.0.1:18000:8000 nexus-backend:ci
          trap 'docker logs nexus-backend-ci; docker rm --force nexus-backend-ci' EXIT
          python scripts/check_backend_startup.py http://127.0.0.1:18000

  frontend:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Run frontend unit tests
        run: npm run test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  mvp-smoke:
    name: k6 MVP smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Install applications
        run: |
          pip install -e ./backend
          npm ci --prefix frontend

      - name: Start backend and frontend
        shell: bash
        run: |
          uvicorn nexus_backend.app:app --host 127.0.0.1 --port 8000 > /tmp/nexus-backend.log 2>&1 &
          echo $! > /tmp/nexus-backend.pid
          npm --prefix frontend run dev > /tmp/nexus-frontend.log 2>&1 &
          echo $! > /tmp/nexus-frontend.pid

      - name: Wait for applications
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/dashboard > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexus-backend.log
          cat /tmp/nexus-frontend.log
          exit 1

      - name: Run k6 smoke test
        run: k6 run nexus-k6-tests/smoke.js

      - name: Print service logs on failure
        if: failure()
        run: |
          cat /tmp/nexus-backend.log || true
          cat /tmp/nexus-frontend.log || true

      - name: Stop applications
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/nexus-backend.pid)" 2>/dev/null || true
          kill "$(cat /tmp/nexus-frontend.pid)" 2>/dev/null || true

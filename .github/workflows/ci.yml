name: nexus-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate repository contract
        run: python scripts/validate_repo.py

  backend:
    name: Backend smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend
        run: pip install -e "./backend[dev]"

      - name: Validate frozen interface contracts
        env:
          NEXUS_CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_contracts.py --base-ref "$NEXUS_CONTRACT_BASE_REF"

      - name: Lint backend and validators
        run: ruff check backend scripts

      - name: Run backend tests
        run: pytest backend/tests -q

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

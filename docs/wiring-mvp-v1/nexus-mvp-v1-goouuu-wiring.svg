<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font:800 44px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .subtitle{font:600 24px 'Segoe UI',Arial,sans-serif;fill:#526b82}
      .box-title{font:800 25px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .label{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .small{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#526b82}
      .tiny{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#526b82}
      .warning{font:800 18px 'Segoe UI',Arial,sans-serif;fill:#c62828}
      .terminal{stroke:#fff;stroke-width:3}
      .wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .halo{fill:none;stroke:#f7fafc;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#f7fafc"/>
  <text x="900" y="65" text-anchor="middle" class="title">NeXus MVP V1 — SƠ ĐỒ ĐẤU DÂY AN TOÀN</text>
  <text x="900" y="105" text-anchor="middle" class="subtitle">GOOUUU ESP32-S3-N16R8 + INA219 + L298N + JGB37-520 Encoder</text>

  <!-- Source -->
  <g filter="url(#shadow)">
    <rect x="35" y="155" width="245" height="245" rx="22" fill="#fff5f5" stroke="#ff718a" stroke-width="3"/>
  </g>
  <text x="157" y="195" text-anchor="middle" class="box-title">NGUỒN DC 12V</text>
  <text x="157" y="226" text-anchor="middle" class="small">Ổn áp, tối thiểu 3A</text>
  <circle cx="90" cy="285" r="16" fill="#e5252a" class="terminal"/>
  <text x="125" y="270" class="label">+12V</text>
  <circle cx="90" cy="350" r="16" fill="#111827" class="terminal"/>
  <text x="125" y="357" class="label">0V / GND</text>

  <!-- Fuse and switch -->
  <g filter="url(#shadow)">
    <rect x="325" y="205" width="215" height="145" rx="18" fill="#fffaf0" stroke="#f59e42" stroke-width="3"/>
  </g>
  <text x="432" y="238" text-anchor="middle" class="label">CẦU CHÌ + CÔNG TẮC</text>
  <rect x="350" y="270" width="55" height="26" rx="6" fill="#e6edf3" stroke="#718096" stroke-width="3"/>
  <line x1="405" y1="283" x2="430" y2="283" stroke="#102a43" stroke-width="5"/>
  <circle cx="435" cy="283" r="7" fill="#fff" stroke="#102a43" stroke-width="4"/>
  <circle cx="500" cy="283" r="7" fill="#fff" stroke="#102a43" stroke-width="4"/>
  <line x1="442" y1="278" x2="487" y2="250" stroke="#102a43" stroke-width="5"/>

  <!-- INA219 -->
  <g filter="url(#shadow)">
    <rect x="585" y="145" width="310" height="345" rx="22" fill="#f2f8ff" stroke="#4f9df8" stroke-width="3"/>
  </g>
  <text x="740" y="185" text-anchor="middle" class="box-title">INA219 — ĐO HIGH-SIDE</text>
  <text x="740" y="216" text-anchor="middle" class="small">Đo dòng và điện áp phía cao</text>
  <text x="610" y="258" class="label">VIN+</text>
  <circle cx="585" cy="283" r="15" fill="#e5252a" class="terminal"/>
  <text x="815" y="258" class="label">VIN−</text>
  <circle cx="895" cy="283" r="15" fill="#e5252a" class="terminal"/>
  <text x="625" y="421" text-anchor="middle" class="label">VCC</text>
  <text x="700" y="421" text-anchor="middle" class="label">GND</text>
  <text x="780" y="421" text-anchor="middle" class="label">SDA</text>
  <text x="855" y="421" text-anchor="middle" class="label">SCL</text>
  <circle cx="625" cy="455" r="14" fill="#8b2be2" class="terminal"/>
  <circle cx="700" cy="455" r="14" fill="#111827" class="terminal"/>
  <circle cx="780" cy="455" r="14" fill="#246be8" class="terminal"/>
  <circle cx="855" cy="455" r="14" fill="#246be8" class="terminal"/>

  <!-- L298N -->
  <g filter="url(#shadow)">
    <rect x="980" y="145" width="365" height="370" rx="22" fill="#f1fff7" stroke="#43d887" stroke-width="3"/>
  </g>
  <text x="1162" y="185" text-anchor="middle" class="box-title">L298N — KÊNH A</text>
  <text x="1162" y="218" text-anchor="middle" class="small">THÁO jumper ENA để điều khiển PWM</text>
  <text x="1162" y="246" text-anchor="middle" class="small">GẮN 5V-EN; không cấp thêm 5V ngoài</text>
  <text x="1005" y="275" class="label">VS / +12V</text>
  <circle cx="980" cy="300" r="15" fill="#e5252a" class="terminal"/>
  <text x="1260" y="275" class="label">OUT1</text>
  <circle cx="1345" cy="300" r="15" fill="#f07d18" class="terminal"/>
  <text x="1260" y="332" class="label">OUT2</text>
  <circle cx="1345" cy="355" r="15" fill="#f07d18" class="terminal"/>
  <text x="1025" y="436" text-anchor="middle" class="label">GND</text>
  <text x="1095" y="420" text-anchor="middle" class="label">5V</text>
  <text x="1095" y="443" text-anchor="middle" class="label">LOGIC</text>
  <text x="1165" y="436" text-anchor="middle" class="label">ENA</text>
  <text x="1240" y="436" text-anchor="middle" class="label">IN1</text>
  <text x="1310" y="436" text-anchor="middle" class="label">IN2</text>
  <circle cx="1025" cy="475" r="14" fill="#111827" class="terminal"/>
  <circle cx="1095" cy="475" r="14" fill="#9ca3af" class="terminal"/>
  <circle cx="1165" cy="475" r="14" fill="#246be8" class="terminal"/>
  <circle cx="1240" cy="475" r="14" fill="#246be8" class="terminal"/>
  <circle cx="1310" cy="475" r="14" fill="#246be8" class="terminal"/>

  <!-- Motor -->
  <g filter="url(#shadow)">
    <rect x="1430" y="145" width="335" height="370" rx="22" fill="#fffdf2" stroke="#f0b51a" stroke-width="3"/>
  </g>
  <text x="1597" y="185" text-anchor="middle" class="box-title">JGB37-520 12V + ENCODER</text>
  <text x="1597" y="216" text-anchor="middle" class="small">Motor 12V + encoder Hall A/B</text>
  <text x="1455" y="307" class="label">M+</text>
  <circle cx="1430" cy="300" r="15" fill="#f07d18" class="terminal"/>
  <text x="1455" y="362" class="label">M−</text>
  <circle cx="1430" cy="355" r="15" fill="#f07d18" class="terminal"/>
  <rect x="1530" y="265" width="145" height="95" rx="45" fill="#cbd5e1" stroke="#526b82" stroke-width="4"/>
  <rect x="1675" y="298" width="42" height="27" fill="#64748b"/>
  <text x="1485" y="436" text-anchor="middle" class="label">VCC 3.3V</text>
  <text x="1565" y="436" text-anchor="middle" class="label">GND</text>
  <text x="1650" y="436" text-anchor="middle" class="label">A</text>
  <text x="1725" y="436" text-anchor="middle" class="label">B</text>
  <circle cx="1485" cy="475" r="14" fill="#8b2be2" class="terminal"/>
  <circle cx="1565" cy="475" r="14" fill="#111827" class="terminal"/>
  <circle cx="1650" cy="475" r="14" fill="#08a85a" class="terminal"/>
  <circle cx="1725" cy="475" r="14" fill="#08a85a" class="terminal"/>

  <!-- Power and motor wires -->
  <path d="M90 285 H325" class="wire" stroke="#e5252a" stroke-width="9"/>
  <path d="M540 283 H585" class="wire" stroke="#e5252a" stroke-width="9"/>
  <path d="M895 283 H940 V300 H980" class="wire" stroke="#e5252a" stroke-width="9"/>
  <path d="M1345 300 H1430" class="wire" stroke="#f07d18" stroke-width="8"/>
  <path d="M1345 355 H1430" class="wire" stroke="#f07d18" stroke-width="8"/>

  <!-- Safety callout -->
  <rect x="35" y="500" width="330" height="175" rx="18" fill="#fffaf0" stroke="#f07d18" stroke-width="3"/>
  <polygon points="76,535 42,600 110,600" fill="#ffc55c" stroke="#102a43" stroke-width="4"/>
  <text x="76" y="586" text-anchor="middle" class="box-title">!</text>
  <text x="125" y="542" class="warning">NGẮT 12V KHI ĐẤU DÂY</text>
  <text x="125" y="580" class="warning">KHÔNG NỐI 12V VÀO ESP32</text>
  <text x="125" y="618" class="warning">TẤT CẢ PHẢI CHUNG GND</text>

  <!-- Controller -->
  <g filter="url(#shadow)">
    <rect x="410" y="700" width="970" height="260" rx="24" fill="#faf7ff" stroke="#a67cff" stroke-width="3"/>
  </g>
  <text x="895" y="755" text-anchor="middle" class="box-title">GOOUUU ESP32-S3-N16R8 — NGUỒN RIÊNG QUA USB DATA</text>
  <rect x="445" y="800" width="190" height="105" rx="16" fill="#eef6ff" stroke="#2878d0" stroke-width="3"/>
  <line x1="385" y1="852" x2="445" y2="852" stroke="#246be8" stroke-width="16"/>
  <text x="540" y="838" text-anchor="middle" class="label">USB DATA</text>
  <text x="540" y="866" text-anchor="middle" class="small">Nguồn ESP32-S3</text>
  <text x="540" y="892" text-anchor="middle" class="small">chỉ qua USB</text>

  <!-- Controller pin dots on top edge -->
  <circle cx="505" cy="700" r="14" fill="#8b2be2" class="terminal"/>
  <text x="505" y="790" text-anchor="middle" class="label">3V3</text>
  <circle cx="585" cy="700" r="14" fill="#111827" class="terminal"/>
  <text x="585" y="790" text-anchor="middle" class="label">GND</text>
  <circle cx="730" cy="700" r="14" fill="#246be8" class="terminal"/>
  <text x="730" y="790" text-anchor="middle" class="label">GPIO1</text>
  <circle cx="820" cy="700" r="14" fill="#246be8" class="terminal"/>
  <text x="820" y="790" text-anchor="middle" class="label">GPIO2</text>
  <circle cx="955" cy="700" r="14" fill="#246be8" class="terminal"/>
  <text x="955" y="790" text-anchor="middle" class="label">GPIO12</text>
  <circle cx="1050" cy="700" r="14" fill="#246be8" class="terminal"/>
  <text x="1050" y="790" text-anchor="middle" class="label">GPIO13</text>
  <circle cx="1145" cy="700" r="14" fill="#246be8" class="terminal"/>
  <text x="1145" y="790" text-anchor="middle" class="label">GPIO14</text>
  <circle cx="1260" cy="700" r="14" fill="#08a85a" class="terminal"/>
  <text x="1260" y="790" text-anchor="middle" class="label">GPIO16</text>
  <circle cx="1340" cy="700" r="14" fill="#08a85a" class="terminal"/>
  <text x="1340" y="790" text-anchor="middle" class="label">GPIO17</text>

  <!-- 3V3 rail: explicit junctions -->
  <path d="M505 700 V620 H1485 V475" class="wire" stroke="#8b2be2" stroke-width="7"/>
  <path d="M625 455 V620" class="wire" stroke="#8b2be2" stroke-width="7"/>
  <circle cx="505" cy="620" r="8" fill="#8b2be2"/>
  <circle cx="625" cy="620" r="8" fill="#8b2be2"/>
  <circle cx="1485" cy="620" r="8" fill="#8b2be2"/>

  <!-- I2C and control wires. White halos mark non-connected rail crossings. -->
  <path d="M780 455 V555 H730 V700" class="halo"/>
  <path d="M780 455 V555 H730 V700" class="wire" stroke="#246be8" stroke-width="7"/>
  <path d="M855 455 V530 H820 V700" class="halo"/>
  <path d="M855 455 V530 H820 V700" class="wire" stroke="#246be8" stroke-width="7"/>
  <path d="M1165 475 V545 H955 V700" class="halo"/>
  <path d="M1165 475 V545 H955 V700" class="wire" stroke="#246be8" stroke-width="7"/>
  <path d="M1240 475 V570 H1050 V700" class="halo"/>
  <path d="M1240 475 V570 H1050 V700" class="wire" stroke="#246be8" stroke-width="7"/>
  <path d="M1310 475 V595 H1145 V700" class="halo"/>
  <path d="M1310 475 V595 H1145 V700" class="wire" stroke="#246be8" stroke-width="7"/>

  <!-- Encoder wires -->
  <path d="M1650 475 V665 H1260 V700" class="wire" stroke="#08a85a" stroke-width="7"/>
  <path d="M1725 475 V680 H1340 V700" class="wire" stroke="#08a85a" stroke-width="7"/>

  <!-- Ground bus and branches -->
  <path d="M55 1030 H1745" class="wire" stroke="#111827" stroke-width="10"/>
  <path d="M90 350 H20 V1030 H55" class="wire" stroke="#111827" stroke-width="7"/>
  <path d="M700 455 V540 H385 V1030" class="wire" stroke="#111827" stroke-width="7"/>
  <path d="M585 700 V1030" class="wire" stroke="#111827" stroke-width="7"/>
  <path d="M1025 475 V560 H1400 V1030" class="halo"/>
  <path d="M1025 475 V560 H1400 V1030" class="wire" stroke="#111827" stroke-width="7"/>
  <path d="M1565 475 V1030" class="wire" stroke="#111827" stroke-width="7"/>
  <circle cx="55" cy="1030" r="10" fill="#111827"/>
  <circle cx="385" cy="1030" r="10" fill="#111827"/>
  <circle cx="585" cy="1030" r="10" fill="#111827"/>
  <circle cx="1400" cy="1030" r="10" fill="#111827"/>
  <circle cx="1565" cy="1030" r="10" fill="#111827"/>
  <text x="80" y="1010" class="label">GND CHUNG</text>

  <!-- Labels near wires -->
  <text x="690" y="586" text-anchor="middle" class="tiny">GPIO1 → SDA</text>
  <text x="835" y="515" text-anchor="middle" class="tiny">GPIO2 → SCL</text>
  <text x="1010" y="530" text-anchor="middle" class="tiny">GPIO12 → ENA</text>
  <text x="1130" y="556" text-anchor="middle" class="tiny">GPIO13 → IN1</text>
  <text x="1225" y="586" text-anchor="middle" class="tiny">GPIO14 → IN2</text>
  <text x="1510" y="650" text-anchor="middle" class="tiny">A → GPIO16 · B → GPIO17</text>

  <!-- Legend -->
  <rect x="270" y="1060" width="1260" height="35" rx="12" fill="#fff" stroke="#d8e2ea" stroke-width="2"/>
  <line x1="300" y1="1078" x2="355" y2="1078" stroke="#e5252a" stroke-width="9"/>
  <text x="368" y="1085" class="small">12V</text>
  <line x1="450" y1="1078" x2="505" y2="1078" stroke="#8b2be2" stroke-width="9"/>
  <text x="518" y="1085" class="small">3.3V</text>
  <line x1="615" y1="1078" x2="670" y2="1078" stroke="#111827" stroke-width="9"/>
  <text x="683" y="1085" class="small">GND</text>
  <line x1="785" y1="1078" x2="840" y2="1078" stroke="#246be8" stroke-width="9"/>
  <text x="853" y="1085" class="small">I²C / điều khiển</text>
  <line x1="1035" y1="1078" x2="1090" y2="1078" stroke="#08a85a" stroke-width="9"/>
  <text x="1103" y="1085" class="small">Encoder A/B</text>
  <line x1="1280" y1="1078" x2="1335" y2="1078" stroke="#f07d18" stroke-width="9"/>
  <text x="1348" y="1085" class="small">Motor M+/M−</text>
</svg>

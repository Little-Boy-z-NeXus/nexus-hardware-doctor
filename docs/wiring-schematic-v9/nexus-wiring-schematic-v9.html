function renderBox(b){const [fill,stroke]=kinds[b.kind]||kinds.signal;let out=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${b.r||14}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;

  (b.lines||[]).forEach((s,i)=>{const isObj=typeof s==='object';const text=isObj?s.text:s;const color=isObj&&s.color?s.color:(isObj&&s.muted?C.muted:C.ink);const weight=isObj&&s.bold?700:400;out+=`<text class="t" x="${b.x+(isObj&&s.x?s.x:24)}" y="${b.y+70+i*(b.gap||26)}" font-size="${isObj&&s.size?s.size:12}" fill="${color}" font-weight="${weight}">${E(text)}</text>`});return out}
function renderWire(w){const color=C[w.color]||w.color;return `<path d="${w.d}" fill="none" stroke="${color}" stroke-width="${w.width||4}" stroke-linecap="round" stroke-linejoin="round" ${w.dash?'stroke-dasharray="9 8"':''}/>${w.label?`<rect x="${w.lx-6}" y="${w.ly-17}" width="${Math.max(78,w.label.length*6.5+12)}" height="23" rx="5" fill="#fff" stroke="#e0e6eb"/><text class="t" x="${w.lx}" y="${w.ly}" font-size="10" fill="${C.muted}">${E(w.label)}</text>`:''}`}
function pin(x,y,color){return `<circle cx="${x}" cy="${y}" r="7" fill="${C[color]||color}" stroke="#fff" stroke-width="2"/>`}
function portCard(x,y,w,title,badge,rows,theme='red'){

 let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="15" fill="#fff" stroke="${stroke}" stroke-width="2"/><path d="M${x+15} ${y}H${x+w-15}Q${x+w} ${y} ${x+w} ${y+15}V${y+57}H${x}V${y+15}Q${x} ${y} ${x+15} ${y}Z" fill="${head}"/><text class="t" x="${x+18}" y="${y+36}" font-size="16" font-weight="700">${E(title)}</text><rect x="${x+w-94}" y="${y+15}" width="76" height="28" rx="14" fill="#fff" stroke="${accent}"/><text class="t" x="${x+w-56}" y="${y+34}" text-anchor="middle" font-size="11" font-weight="700">${E(badge)}</text>`;
 rows.forEach((r,i)=>{const yy=y+70+i*43;s+=`<rect x="${x+14}" y="${yy}" width="${w-28}" height="34" rx="8" fill="#fbfcfd" stroke="#d9e2e9"/><rect x="${x+14}" y="${yy}" width="48" height="34" rx="8" fill="${accent}"/><rect x="${x+50}" y="${yy}" width="12" height="34" fill="${accent}"/><text class="t" x="${x+38}" y="${yy+23}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">P${i+1}</text><text class="t" x="${x+74}" y="${yy+23}" font-size="11.5" fill="${r.muted?C.muted:C.ink}" font-weight="${r.bold?700:400}">${E(r.text||r)}</text>`});return s}
function legend(items,y=955){let x=1040;return items.map(([color,label])=>{const s=`<path d="M${x} ${y}h38" stroke="${C[color]}" stroke-width="4" stroke-linecap="round"/><text class="t" x="${x+48}" y="${y+4}" font-size="11" fill="${C.muted}">${E(label)}</text>`;x+=120;return s}).join('')}
function page(p,i){return `<section class="sheet${i===0?' active':''}" data-sheet="${i+1}"><svg viewBox="0 0 1600 1000" role="img" aria-label="${E(p.title)}"><rect width="1600" height="1000" fill="#fff"/><text class="t" x="45" y="42" font-size="13" font-weight="800" letter-spacing="2" fill="#078174">SƠ ĐỒ ${i+1}/${pages.length} · ${E(p.eyebrow)}</text><text class="t" x="45" y="79" font-size="27" font-weight="700">${E(p.title)}</text><text class="t" x="45" y="106" font-size="14" fill="${C.muted}">${E(p.sub)}</text>${(p.boxes||[]).map(renderBox).join('')}${(p.wires||[]).map(renderWire).join('')}${p.extra||''}${legend(p.legend||[['red','12 V'],['purple','5 V'],['black','GND']],p.legendY||955)}</svg></section>`}

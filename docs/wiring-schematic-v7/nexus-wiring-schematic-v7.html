<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>NeXus wiring schematic v7</title>
<style>
  :root{--ink:#102334;--muted:#718293;--border:#d9e2e9;--red:#e52b2f;--black:#111923;--orange:#e36b00;--purple:#8848ed;--blue:#246ee8;--cyan:#00a8bd;--green:#129657;--yellow:#e7ad00;--gray:#7e8994;--paper:#fff;--bg:#edf2f6}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif}.sheet{display:none;width:1600px;height:1000px;background:var(--paper);margin:0;overflow:hidden}.sheet.active{display:block}svg{width:1600px;height:1000px;display:block}
  .title{font-size:27px;font-weight:700;fill:var(--ink)}.sub{font-size:14px;fill:var(--muted)}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;fill:#078174}.section{font-size:14px;font-weight:700;fill:var(--muted);letter-spacing:.04em}.box{fill:#fff;stroke:var(--border);stroke-width:2}.pbox{fill:#fff2f2;stroke:#ef8184}.cbox{fill:#fff6ed;stroke:#ef9a50}.lbox{fill:#f6f1ff;stroke:#ae82f6}.sbox{fill:#eff7ff;stroke:#68a9ed}.gbox{fill:#f3f5f7;stroke:#7b8792}.mbox{fill:#fffbed;stroke:#e8b229}.warnbox{fill:#fff4f4;stroke:#ed8588}.boxtitle{font-size:15px;font-weight:700;fill:var(--ink)}.label{font-size:12px;fill:var(--ink)}.small{font-size:11px;fill:var(--muted)}.tiny{font-size:10px;fill:var(--muted)}
  .wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:2}.red{stroke:var(--red)}.black{stroke:var(--black)}.orange{stroke:var(--orange)}.purple{stroke:var(--purple)}.blue{stroke:var(--blue)}.cyan{stroke:var(--cyan)}.green{stroke:var(--green)}.yellow{stroke:var(--yellow)}.gray{stroke:var(--gray)}.whitewire{stroke:#fff;filter:drop-shadow(0 0 1px #536270)}.dash{stroke-dasharray:8 8}.pin{stroke:#fff;stroke-width:2}.pred{fill:var(--red)}.pblack{fill:var(--black)}.porange{fill:var(--orange)}.ppurple{fill:var(--purple)}.pblue{fill:var(--blue)}.pcyan{fill:var(--cyan)}.pgreen{fill:var(--green)}.pyellow{fill:var(--yellow)}.pgray{fill:var(--gray)}.pwhite{fill:#fff;stroke:#7c8995;stroke-width:2}
  .tag{fill:#fff;stroke:#d9e2e9;stroke-width:1}.tagtext{font-size:10px;fill:var(--muted)}.step{fill:#2d93eb}.steptext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}.legend{font-size:11px;fill:var(--muted)}
</style>
</head>
